<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar perfil - GameNest</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">GameNest</div>
        <div class="nav-links">
            <a href="{{ url_for('perfil') }}">Mi perfil</a>
            <a href="{{ url_for('recomendaciones') }}">Recomendaciones</a>
            <a href="{{ url_for('logout') }}">Cerrar sesión</a>
        </div>
    </nav>

    <main class="container">
        <section class="card form-card">
            <h1>Editar perfil</h1>
            <p class="subtitle">Actualiza tus preferencias para mejorar las recomendaciones.</p>

            <form action="{{ url_for('editar_perfil') }}" method="POST">

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" value="{{ usuario.nombre }}" required>

                <label for="edad">Edad</label>
                <input type="number" id="edad" name="edad" min="3" max="100" value="{{ usuario.edad }}" required>

                <label for="plataforma_preferida">Plataforma preferida</label>
                <select id="plataforma_preferida" name="plataforma_preferida" required>
                    <option value="PC" {% if usuario.plataforma_preferida == "PC" %}selected{% endif %}>PC</option>
                    <option value="PS5" {% if usuario.plataforma_preferida == "PS5" %}selected{% endif %}>PS5</option>
                    <option value="Switch" {% if usuario.plataforma_preferida == "Switch" %}selected{% endif %}>Nintendo Switch</option>
                </select>

                <label for="presupuesto_max">Presupuesto máximo (€)</label>
                <input type="number" id="presupuesto_max" name="presupuesto_max" min="0" step="0.01" value="{{ usuario.presupuesto_max }}" required>

                <label for="genero_preferido">Género favorito</label>
                <select id="genero_preferido" name="genero_preferido" required>
                    {% set generos = ["RPG", "Shooter", "Deportes", "Aventura", "Accion", "Simulacion", "Conduccion", "Battle Royale", "Plataformas", "Lucha", "Metroidvania"] %}
                    {% for genero in generos %}
                        <option value="{{ genero }}" {% if usuario.genero_preferido == genero %}selected{% endif %}>{{ genero }}</option>
                    {% endfor %}
                </select>

                <label for="tipo_preferido">Tipo de juego preferido</label>
                <select id="tipo_preferido" name="tipo_preferido" required>
                    <option value="Singleplayer" {% if usuario.tipo_preferido == "Singleplayer" %}selected{% endif %}>Singleplayer</option>
                    <option value="Multiplayer" {% if usuario.tipo_preferido == "Multiplayer" %}selected{% endif %}>Multiplayer</option>
                </select>

                <button type="submit" class="btn btn-primary">Guardar cambios</button>
            </form>
        </section>
    </main>

</body>
</html>
