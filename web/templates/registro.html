<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear cuenta - GameNest</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">GameNest</div>
        <div class="nav-links">
            <a href="{{ url_for('index') }}">Inicio</a>
            <a href="{{ url_for('login') }}">Iniciar sesión</a>
        </div>
    </nav>

    <main class="container">

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <section class="messages">
                    {% for category, message in messages %}
                        <div class="message {{ category }}">{{ message }}</div>
                    {% endfor %}
                </section>
            {% endif %}
        {% endwith %}

        <section class="card form-card">
            <h1>Crear cuenta</h1>
            <p class="subtitle">Regístrate y configura tus preferencias de videojuegos.</p>

            <form action="{{ url_for('registro') }}" method="POST">

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" minlength="4" required>

                <label for="edad">Edad</label>
                <input type="number" id="edad" name="edad" min="3" max="100" required>

                <label for="plataforma_preferida">Plataforma preferida</label>
                <select id="plataforma_preferida" name="plataforma_preferida" required>
                    <option value="PC">PC</option>
                    <option value="PS5">PS5</option>
                    <option value="Switch">Nintendo Switch</option>
                </select>

                <label for="presupuesto_max">Presupuesto máximo (€)</label>
                <input type="number" id="presupuesto_max" name="presupuesto_max" min="0" step="0.01" required>

                <label for="genero_preferido">Género favorito</label>
                <select id="genero_preferido" name="genero_preferido" required>
                    <option value="RPG">RPG</option>
                    <option value="Shooter">Shooter</option>
                    <option value="Deportes">Deportes</option>
                    <option value="Aventura">Aventura</option>
                    <option value="Accion">Acción</option>
                    <option value="Simulacion">Simulación</option>
                    <option value="Conduccion">Conducción</option>
                    <option value="Battle Royale">Battle Royale</option>
                    <option value="Plataformas">Plataformas</option>
                    <option value="Lucha">Lucha</option>
                    <option value="Metroidvania">Metroidvania</option>
                </select>

                <label for="tipo_preferido">Tipo de juego preferido</label>
                <select id="tipo_preferido" name="tipo_preferido" required>
                    <option value="Singleplayer">Singleplayer</option>
                    <option value="Multiplayer">Multiplayer</option>
                </select>

                <button type="submit" class="btn btn-primary">Crear cuenta</button>
            </form>
        </section>
    </main>

</body>
</html>
